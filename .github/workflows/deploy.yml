name: Deploy website

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore translation cache
        id: translation-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/ci-translations
          key: translation-cache-${{ runner.os }}-${{ hashFiles('.github/scripts/generate-ci-translations.mjs') }}-${{ github.sha }}
          restore-keys: |
            translation-cache-${{ runner.os }}-${{ hashFiles('.github/scripts/generate-ci-translations.mjs') }}-
            translation-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate incremental Traditional Chinese files for CI
        run: npm run generate:ci-translations
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}

      - name: Build site
        run: npm run build --ignore-scripts

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload dist for server deploy
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ./dist

      - name: Save translation cache
        uses: actions/cache/save@v4
        if: always() && steps.translation-cache-restore.outputs.cache-hit != 'true'
        with:
          path: .cache/ci-translations
          key: translation-cache-${{ runner.os }}-${{ hashFiles('.github/scripts/generate-ci-translations.mjs') }}-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_server:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ./dist

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rclone

      - name: Sync dist to OpenList via WebDAV
        env:
          WEBDAV_URL: ${{ secrets.OPENLIST_WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.OPENLIST_WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.OPENLIST_WEBDAV_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in WEBDAV_URL WEBDAV_USERNAME WEBDAV_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required secret for ${variable} is not configured."
              exit 1
            fi
          done

          RCLONE_CONFIG_OPENLIST_PASS="$(rclone obscure "${WEBDAV_PASSWORD}")"
          echo "::add-mask::${RCLONE_CONFIG_OPENLIST_PASS}"

          export RCLONE_CONFIG_OPENLIST_TYPE=webdav
          export RCLONE_CONFIG_OPENLIST_URL="${WEBDAV_URL%/}/"
          export RCLONE_CONFIG_OPENLIST_VENDOR=other
          export RCLONE_CONFIG_OPENLIST_USER="${WEBDAV_USERNAME}"
          export RCLONE_CONFIG_OPENLIST_PASS

          rclone sync ./dist/ openlist:lyricify-site \
            --create-empty-src-dirs \
            --delete-during \
            --retries 3 \
            --low-level-retries 10 \
            --stats 30s \
            --stats-one-line
